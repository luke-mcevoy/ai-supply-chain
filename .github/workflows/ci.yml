name: CI

# Every push and PR: the data must validate, the published atlas must be a fresh verified build,
# no new unreviewed numbers may appear in prose, the app must typecheck/test/build, and the live
# UI must load and work in a real browser. Deploys to Fly from main only when all of that passes.

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data:
    name: Data integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Validate research + verification files
        run: node scripts/validate.mjs
      - name: Published atlas is a fresh, non-draft verified build
        run: node scripts/check-build-fresh.mjs
      - name: No new unquoted numbers in prose
        run: node scripts/audit-numbers.mjs --ci

  app:
    name: App (typecheck, unit tests, build, browser smoke)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: app }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx vite build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env: { CI: "1" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: app/test-results, retention-days: 7 }

  deploy:
    name: Deploy to Fly
    needs: [data, app]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy (skipped unless the FLY_API_TOKEN secret is set)
        env: { FLY_API_TOKEN: "${{ secrets.FLY_API_TOKEN }}" }
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then echo "FLY_API_TOKEN not set; skipping deploy"; exit 0; fi
          flyctl deploy --remote-only
